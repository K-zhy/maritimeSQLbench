services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_DB: maritime_benchmark
      POSTGRES_USER: benchmark_admin
      POSTGRES_PASSWORD: benchmark_local_only
    ports:
      - "127.0.0.1:${MARITIME_SQL_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark_admin -d maritime_benchmark"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - maritime_sql_data:/var/lib/postgresql/data

volumes:
  maritime_sql_data: